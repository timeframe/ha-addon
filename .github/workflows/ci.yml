name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1.342.0
      with:
        ruby-version: 4.0.10
        rubygems: 4.1.0
        bundler: 4.1.0
    - uses: actions/cache@v6.1.0
      with:
        path: vendor/bundle
        key: gems-build-rails-main-ruby-4.0.10-${{ hashFiles('**/Gemfile.lock') }}
    - name: Lint with standard
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
        bundle exec standardrb
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y imagemagick
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1.342.0
      with:
        ruby-version: 4.0.10
        rubygems: 4.1.0
        bundler: 4.1.0
    - uses: actions/cache@v6.1.0
      with:
        path: vendor/bundle
        key: gems-build-rails-main-ruby-4.0.10-${{ hashFiles('**/Gemfile.lock') }}
    - name: Run tests
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
        bundle exec rake db:test:prepare
        bundle exec rake
      env:
        RAILS_ENV: test
        TIMEFRAME_HOME_ASSISTANT_TOKEN: "ci-test-token"
        PGHOST: 127.0.0.1
        PGUSER: postgres
        PGPASSWORD: postgres
