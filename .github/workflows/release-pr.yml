name: Prepare release pull request

"on":
  workflow_dispatch:
    inputs:
      bump:
        description: Release version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions: {}

concurrency:
  group: release-pr-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_BUMP: ${{ inputs.bump }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    outputs:
      source_sha: ${{ steps.notes.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: 4.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.105
      - name: Generate changelog
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: ruby script/release-pr generate "$RUNNER_TEMP/release-notes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            ${{ runner.temp }}/release-notes/notes.md
            ${{ runner.temp }}/release-notes/metadata.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  create:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.generate.outputs.source_sha }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: 4.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby script/release-pr create "$RUNNER_TEMP/release-notes"
