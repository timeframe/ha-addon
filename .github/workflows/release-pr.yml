name: Prepare release pull request

"on":
  workflow_dispatch:
    inputs:
      bump:
        description: Release version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: 4.0.2
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: ruby script/release-pr
