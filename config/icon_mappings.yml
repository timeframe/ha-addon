# Global icon mappings for auto-assigning icons to events.
# These take priority over the MDI meta.json tag/alias matching.
# Format: "keyword": "mdi-icon-name" (without mdi- prefix)
# Keywords are matched case-insensitively against event summary words.

church: "church"
school: "bag-personal"
nap: "bed"
playground: "slide"
grocery: "cart"
groceries: "cart"
farmer: "tractor"
