# Holidays (Google built-in holiday calendars).
# Only distinctive, holiday-specific keywords are used here so these mappings
# never fire on ordinary events. Generic words that also appear in holiday
# names (day, eve, good, friday, labor, memorial, king, queen, new, year) are
# deliberately omitted.

# Christmas / winter
christmas: "pine-tree"
xmas: "pine-tree"
noel: "pine-tree"
yule: "pine-tree"
yuletide: "pine-tree"
nativity: "pine-tree"
santa: "gift"
advent: "candle"
epiphany: "star"
candlemas: "candle"

# New Year (Hogmanay is Scotland's; "year" covers New Year's Day/Eve)
hogmanay: "firework"
year: "firework"

# Halloween / autumn
halloween: "halloween"
samhain: "halloween"
pumpkin: "pumpkin"
thanksgiving: "turkey"

# Easter / Christian observances
easter: "egg-easter"
lent: "cross"
pentecost: "cross"
ascension: "church"
assumption: "church"
michaelmas: "church"

# Valentine's Day
valentine: "heart"

# St. Patrick's Day
patrick: "clover"
shamrock: "clover"

